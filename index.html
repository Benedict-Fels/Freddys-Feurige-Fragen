<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1a16">
<title>Freddys Feurige Fragen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Yellowtail&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: Kneipentafel. Dunkles Flaschengrün, Kreide-Text, Bierdeckel-Badges in Bernstein. Mobile first, Beamer skaliert hoch. */
:root{
  --bg:#0e1a16; --panel:#14241e; --panel2:#1b2f27; --line:#2b4238;
  --chalk:#ede7d7; --muted:#9fb3a8; --amber:#f0a73a; --amber-ink:#1d1405;
  --good:#86d38f; --bad:#ff8070; --info:#8fc3ff;
  --f-display:"Alfa Slab One","Rockwell","Georgia",serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
  --f-script:"Yellowtail","Brush Script MT",cursive;
  --fire-1:#ffd23f; --fire-2:#f28a1e; --fire-3:#e2381b;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--chalk);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
img{max-width:100%;display:block}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--chalk);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:.7rem .8rem;width:100%}
input:focus,textarea:focus{outline:2px solid var(--amber);outline-offset:1px;border-color:transparent}
textarea{resize:vertical;min-height:4.5rem}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:12px 96px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;letter-spacing:.01em;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:1.9rem} h2{font-size:1.45rem} h3{font-size:1.1rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.mono{font-family:var(--f-mono)}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.12em;color:var(--amber);font-weight:700}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-s{display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grow{flex:1 1 auto;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card.hi{border-color:var(--amber)}
.sep{height:1px;background:var(--line);margin:4px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:.6rem 1rem;font-weight:600;min-height:44px;text-align:center}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:.3rem .75rem;font-size:.88rem}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:.2rem .65rem;font-size:.85rem;background:var(--panel2)}
.chip.ok{border-color:color-mix(in srgb,var(--good) 55%,transparent);color:var(--good)}
.chip.amb{border-color:var(--amber);color:var(--amber)}
.badge{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:.15rem .5rem;border-radius:6px;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.badge.t-classic{color:var(--info)} .badge.t-hgr{color:var(--bad)} .badge.t-bluff{color:var(--amber)} .badge.t-estimate{color:var(--good)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--bad);display:inline-block}
.dot.on{background:var(--good)}
/* Bierdeckel */
.mat{flex:0 0 auto;width:2.4em;height:2.4em;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);color:var(--amber-ink);background:var(--amber);box-shadow:inset 0 0 0 3px var(--amber),inset 0 0 0 5px var(--amber-ink)}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;font-weight:600;min-height:56px}
.opt.sel{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 14%,var(--panel))}
.opt[disabled]{opacity:.5}
.opt .txt{flex:1;min-width:0}
.tag{font-size:.75rem;color:var(--muted);font-weight:500}
.good{color:var(--good)} .bad{color:var(--bad)} .amber{color:var(--amber)}
/* top bar */
.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.bar .in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.brand{font-family:var(--f-display);font-size:1.15rem}
.tabs{display:flex;gap:4px;overflow-x:auto;max-width:760px;margin:0 auto;padding:0 12px 8px}
.tab{border:0;background:transparent;color:var(--muted);padding:.45rem .8rem;border-radius:999px;font-weight:600;white-space:nowrap}
.tab.on{background:var(--panel2);color:var(--chalk)}
.ans-row{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.ans-row:first-child{border-top:0}
.ans-row .who{font-weight:700;min-width:0}
.ans-row .what{flex:1;min-width:0;overflow-wrap:anywhere}
.mark{min-width:46px;min-height:40px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-weight:800}
.mark.m1{background:color-mix(in srgb,var(--good) 25%,var(--panel2));border-color:var(--good);color:var(--good)}
.mark.mh{background:color-mix(in srgb,var(--amber) 22%,var(--panel2));border-color:var(--amber);color:var(--amber)}
.mark.m0{color:var(--bad)}
.thumb{border-radius:8px;border:1px solid var(--line);background:#fff;cursor:zoom-in}
.tips{display:flex;flex-direction:column;gap:10px}
.tip{border:1px solid var(--line);border-radius:var(--r);padding:10px;background:var(--panel)}
.tip.new{border-color:var(--amber);animation:pulse 1.6s ease-out 2}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--amber) 60%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
@media (prefers-reduced-motion:reduce){.tip.new{animation:none}}
.score-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.score-row:first-child{border-top:0}
.rank{font-family:var(--f-display);width:1.6em;color:var(--muted)}
.pts{font-family:var(--f-display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.stepper{display:flex;align-items:center;gap:6px}
.stepper b{min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.scroll-x{overflow-x:auto}
table.grid{border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums}
table.grid th,table.grid td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.grid th:first-child,table.grid td:first-child{text-align:left}
.qrbox{background:#fff;border-radius:10px;padding:8px;display:inline-block;line-height:0}
.qrbox svg{width:100%;height:auto}
/* modal */
.modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:760px;max-height:92vh;overflow:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:800px){.modal{align-items:center}.sheet{border-radius:16px}}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.82rem;color:var(--muted);font-weight:600}
.lightbox{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.92);overflow:auto;display:flex;align-items:center;justify-content:center;padding:16px}
.lightbox img{max-width:100%;max-height:none;background:#fff;border-radius:6px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--chalk);color:var(--bg);padding:.6rem 1rem;border-radius:999px;font-weight:600;z-index:50;max-width:calc(100% - 32px);text-align:center}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;box-shadow:0 6px 20px rgba(0,0,0,.45)}
.phase{display:flex;gap:4px;flex-wrap:wrap}
.phase span{font-size:.75rem;padding:.2rem .55rem;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.phase span.on{background:var(--amber);color:var(--amber-ink);border-color:var(--amber);font-weight:700}
.phase span.done{color:var(--chalk)}
.item-label{font-family:var(--f-display);color:var(--amber);margin-right:.35em}
/* Logo */
.logo{display:inline-flex;align-items:center;gap:.35em;line-height:1}
.logo .flame{width:1.05em;height:1.4em;flex:0 0 auto;filter:drop-shadow(0 0 .25em rgba(242,138,30,.45));transform-origin:50% 90%;animation:flick 2.4s ease-in-out infinite}
.logo .lw{display:flex;flex-direction:column;align-items:flex-start}
.logo .l1{font-family:var(--f-script);color:var(--chalk);font-size:.62em;margin:0 0 -.12em .08em;transform:rotate(-4deg)}
.logo .l2{font-family:var(--f-display);font-size:1em;letter-spacing:.01em;background:linear-gradient(180deg,var(--fire-1) 8%,var(--fire-2) 52%,var(--fire-3) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.logo.sm{font-size:1.15rem}
.logo.md{font-size:clamp(1.9rem,8vw,2.6rem)}
.logo.lg{font-size:clamp(2.4rem,7vw,5.2rem)}
.logo.lg .flame,.logo.md .flame{width:.95em;height:1.3em}
@keyframes flick{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.04,.97) rotate(-2deg)}60%{transform:scale(.97,1.04) rotate(2deg)}}
@media (prefers-reduced-motion:reduce){.logo .flame{animation:none}}
.embers{position:fixed;inset:auto 0 0 0;height:38vh;pointer-events:none;background:radial-gradient(60% 100% at 50% 100%,rgba(226,56,27,.16),transparent 70%);z-index:0}
.review{background:#f6f3ea;color:#22262a;border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;text-align:left}
.rv-head{display:flex;gap:10px;align-items:center}
.rv-av{width:2.1em;height:2.1em;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:0 0 auto}
.rv-name{font-weight:700;line-height:1.2}
.rv-meta{font-size:.85em;color:#5f6368;display:flex;gap:8px;align-items:center}
.rv-stars{color:#e7a11a;letter-spacing:1px}
.rv-stars i{font-style:normal;color:#c9c5ba}
.review p{margin:0;overflow-wrap:anywhere}
.beamer /* Logo */
.logo{display:inline-flex;align-items:center;gap:.35em;line-height:1}
.logo .flame{width:1.05em;height:1.4em;flex:0 0 auto;filter:drop-shadow(0 0 .25em rgba(242,138,30,.45));transform-origin:50% 90%;animation:flick 2.4s ease-in-out infinite}
.logo .lw{display:flex;flex-direction:column;align-items:flex-start}
.logo .l1{font-family:var(--f-script);color:var(--chalk);font-size:.62em;margin:0 0 -.12em .08em;transform:rotate(-4deg)}
.logo .l2{font-family:var(--f-display);font-size:1em;letter-spacing:.01em;background:linear-gradient(180deg,var(--fire-1) 8%,var(--fire-2) 52%,var(--fire-3) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.logo.sm{font-size:1.15rem}
.logo.md{font-size:clamp(1.9rem,8vw,2.6rem)}
.logo.lg{font-size:clamp(2.4rem,7vw,5.2rem)}
.logo.lg .flame,.logo.md .flame{width:.95em;height:1.3em}
@keyframes flick{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.04,.97) rotate(-2deg)}60%{transform:scale(.97,1.04) rotate(2deg)}}
@media (prefers-reduced-motion:reduce){.logo .flame{animation:none}}
.embers{position:fixed;inset:auto 0 0 0;height:38vh;pointer-events:none;background:radial-gradient(60% 100% at 50% 100%,rgba(226,56,27,.16),transparent 70%);z-index:0}
.review{font-size:1.15em;max-width:46em;margin:0 auto;width:100%}
.big-center{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
/* Beamer */
.beamer{min-height:100vh;padding:3vh 4vw;display:flex;flex-direction:column;gap:2.5vh;font-size:clamp(16px,1.7vw,34px)}
.beamer h1{font-size:2.6em}
.beamer h2{font-size:1.8em}
.beamer .eyebrow{font-size:.7em}
.beamer .card{padding:1em}
.b-head{display:flex;justify-content:space-between;align-items:baseline;gap:1em}
.b-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,22em),1fr));gap:1em}
.b-items{display:flex;flex-direction:column;gap:.55em}
.b-items .it{display:flex;gap:.6em;align-items:baseline}
.b-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,18em),1fr));gap:.8em}
.b-opts .opt{font-size:1em;min-height:3.2em}
.b-tip-main img{max-height:58vh;width:auto;margin:0 auto;background:#fff;border-radius:8px}
.b-score{display:flex;flex-direction:column;gap:.2em;max-width:34em;width:100%;margin:0 auto}
.b-score .score-row{font-size:1.3em}
.b-qr{width:min(28vh,14em)}
</style>
</head>

function field(label, path, val, opts = {}) {

  return `<div class="field"><label for="${id}">${label}</label>${tag}${opts.hint ? `<span class="small muted">${opts.hint}</span>` : ""}</div>`;

function imgField(path, key) {

}

}
function setPath(obj, path, val) { const ps = path.split("."); let o = obj; for (let i = 0; i < ps.length - 1; i++) o = o[ps[i]]; o[ps[ps.length - 1]] = val; }
function getPath(obj, path) { return path.split(".").reduce((o, k) => o && o[k], obj); }
function openEditor(q) {
  ED = clone(q); ED_IMGS = {};
  const mount = sheet => {
    sheet.innerHTML = editorHtml();
    sheet.addEventListener("input", e => { const p = e.target.dataset.path; if (p) setPath(ED, p, e.target.value); });
    sheet.addEventListener("change", async e => {
      const p = e.target.dataset.img; if (!p || !e.target.files[0]) return;
      try { const url = await resizeImage(e.target.files[0]); const key = "u_" + rand(8); ED_IMGS[key] = url; setPath(ED, p, key); sheet.innerHTML = editorHtml(); }
      catch (err) { toast("Das Bild konnte nicht gelesen werden"); }
    });
  };
  openModal("", mount);
}
function rerenderEditor() { const sh = $("#modal-root .sheet"); if (sh) { const st = sh.scrollTop; sh.innerHTML = editorHtml(); sh.scrollTop = st; } }
function resizeImage(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => { const im = new Image(); im.onload = () => {
      let w = im.naturalWidth, h = im.naturalHeight; const max = 1100; if (w > max) { h = Math.round(h * max / w); w = max; }
      const c = document.createElement("canvas"); c.width = w; c.height = h; const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, w, h); x.drawImage(im, 0, 0, w, h);
      let q = .82, url = c.toDataURL("image/jpeg", q); while (url.length > 330000 && q > .4) { q -= .12; url = c.toDataURL("image/jpeg", q); }
      res(url); }; im.onerror = rej; im.src = r.result; };
    r.onerror = rej; r.readAsDataURL(file);
  });
}
function saveEditor(andStart) {
  const q = ED;
  if (q.type === "classic") q.items.forEach(it => { it.points = parseNum(it.points) || 1; });
  if (q.type === "hgr") { q.maxPoints = parseInt(q.maxPoints) || q.tips.length || 1; q.step = parseInt(q.step) || 1; q.minPoints = parseInt(q.minPoints) || 1; q.tips.forEach(t => { t.stars = Math.max(0, Math.min(5, parseInt(t.stars) || 0)); }); }

  if (q.type === "bluff" && !String(q.truth || "").trim()) { toast("Bitte die richtige Antwort eintragen"); return; }
  // Bilder übernehmen (nur verwendete)
  const used = new Set(); (q.items || []).concat(q.tips || []).forEach(x => x.img && used.add(x.img));
  let imgChanged = false;
  Object.entries(ED_IMGS).forEach(([k, v]) => { if (used.has(k)) { IMGS[k] = v; imgChanged = true; } });
  const i = A.catalog.questions.findIndex(x => x.id === q.id);
  if (i >= 0) A.catalog.questions[i] = q; else A.catalog.questions.push(q);
  if (imgChanged) { gcImages(); saveImgs(); }

}
function gcImages() {

        : `<div class="b-items">${q.items.map((it, i) => `<div class="it"><span class="item-label">${LETTERS[i].toLowerCase()})</span><span>${esc(it.text)}${R ? `<br><b class="amber">${esc(R.solutions[it.id])}</b>` : ""}</span></div>`).join("")}</div>`;
    } else if (q.type === "hgr") {
      const tips = q.tips || []; const cur = tips[(P === "reveal" ? tips.length : q.tipsShown) - 1];
      if (P === "reveal") h += `<h1 class="amber">${esc(S.reveal.solution)}</h1>${S.reveal.fast ? `<p>Erkannt von <b class="amber">${esc(nm(S.reveal.fast))}</b> bei Tipp ${S.reveal.winTip} (+${fmtPts(S.reveal.points[S.reveal.fast] || 0)})</p>` : `<p class="muted">Keiner hat es erkannt.</p>`}`;
      else h += `<p class="eyebrow">Tipp ${q.tipsShown} von ${q.tipsTotal} · jetzt ${q.pointsNow} Punkte · Antwort laut reinrufen!</p>`;
      if (cur && P !== "reveal") h += `<div class="b-tip-main">${reviewCard(cur)}${pimg(cur.img, "", "")}</div>`;
    } else if (q.type === "bluff" && (P === "vote" || P === "reveal")) {
      const R = S.reveal;
      h += `<div class="b-opts">${q.options.map((o, i) => { const ro = R && R.options.find(x => x.id === o.id);
        return `<div class="opt" style="${ro && ro.kind === "truth" ? "border-color:var(--good)" : ""}"><span class="mat">${LETTERS[i]}</span><span class="txt">${esc(o.text)}${ro ? `<br><span class="tag" style="font-size:.7em">${ro.kind === "truth" ? '<span class="good">✓ echter Slogan</span>' : ro.kind === "bait" ? "Köder vom Quizmaster" : "von " + esc(ro.authors.map(nm).join(", "))}${ro.voters.length ? " · gewählt von " + esc(ro.voters.map(nm).join(", ")) : ""}</span>` : ""}</span></div>`; }).join("")}</div>`;
    } else if (q.type === "estimate" && P === "reveal") {
      h += `<h1 class="amber">${esc(String(S.reveal.solution).replace(".", ","))} ${esc(q.unit || "")}</h1>`;
    }
    if (P === "reveal" && S.reveal && S.reveal.points) {
      const pts = S.reveal.points; h += `<div class="row">${teams.map(t => `<span class="chip ${pts[t.id] ? "ok" : ""}" style="font-size:.85em">${esc(t.name)} +${fmtPts(pts[t.id] || 0)}</span>`).join("")}</div>`;
    }
    if (P === "locked") h += `<p class="amber"><b>Antworten geschlossen</b></p>`;
    h += statusRow;
  }
  app.innerHTML = `<div class="embers"></div><div class="beamer" style="position:relative;z-index:1">${h}</div>`;
}

/* ============ Klick-Verteilung & Start ============ */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const acts = ROLE === "admin" ? ADMIN_ACTS : TEAM_ACTS;
  const f = acts[b.dataset.act]; if (!f) return;
  e.preventDefault(); f(b.dataset, b, e);
});
window.addEventListener("hashchange", () => location.reload());
if (typeof mqtt === "undefined") { $("#app").innerHTML = `<div class="wrap"><p class="bad">Die Seite konnte nicht vollständig geladen werden.</p></div>`; }
else if (ROLE === "admin") adminBoot(); else teamBoot();
</script>
</body>
</html>
